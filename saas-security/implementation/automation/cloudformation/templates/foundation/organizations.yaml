AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Organizations setup with organizational units and account structure for multi-tenant SaaS security foundation'

# This template sets up the foundational AWS Organizations structure
# Requirements covered: 1.1, 1.2, 1.3, 1.4, 1.5

Parameters:
  AuditAccountEmail:
    Type: String
    Description: Email address for the Audit Account (must be unique across all AWS accounts)
    Default: audit-account@example.com
    
  LoggingAccountEmail:
    Type: String
    Description: Email address for the Logging Account (must be unique across all AWS accounts)
    Default: logging-account@example.com
    
  WorkloadAccountEmail:
    Type: String
    Description: Email address for the Workload Account (must be unique across all AWS accounts)
    Default: workload-account@example.com
    
  OrganizationFeatureSet:
    Type: String
    Description: Feature set for the organization
    Default: ALL
    AllowedValues:
      - ALL
      - CONSOLIDATED_BILLING
    
  EnableCloudTrail:
    Type: String
    Description: Enable CloudTrail for organization-wide logging
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  EnableCloudTrailCondition: !Equals [!Ref EnableCloudTrail, 'true']

Resources:
  # AWS Organization - Root resource (Requirement 1.1)
  Organization:
    Type: AWS::Organizations::Organization
    Properties:
      FeatureSet: !Ref OrganizationFeatureSet
    
  # Security Organizational Unit (Requirement 1.3)
  SecurityOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Security
      ParentId: !GetAtt Organization.RootId
    DependsOn: Organization
    
  # Workloads Organizational Unit (Requirement 1.3)
  WorkloadsOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Workloads
      ParentId: !GetAtt Organization.RootId
    DependsOn: Organization
    
  # Audit Account (Requirement 1.2)
  AuditAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: Audit Account
      Email: !Ref AuditAccountEmail
      RoleName: OrganizationAccountAccessRole
      ParentIds:
        - !Ref SecurityOU
    DependsOn: SecurityOU
    
  # Logging Account (Requirement 1.2)
  LoggingAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: Logging Account
      Email: !Ref LoggingAccountEmail
      RoleName: OrganizationAccountAccessRole
      ParentIds:
        - !Ref SecurityOU
    DependsOn: SecurityOU
    
  # Workload Account (Requirement 1.2)
  WorkloadAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: Workload Account
      Email: !Ref WorkloadAccountEmail
      RoleName: OrganizationAccountAccessRole
      ParentIds:
        - !Ref WorkloadsOU
    DependsOn: WorkloadsOU

  # IAM Role for cross-account access from management account
  OrganizationManagementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OrganizationManagementRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/OrganizationsServiceTrustPolicy
      Policies:
        - PolicyName: OrganizationManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - organizations:*
                  - account:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: 
                  - !Sub 'arn:aws:iam::${AuditAccount}:role/OrganizationAccountAccessRole'
                  - !Sub 'arn:aws:iam::${LoggingAccount}:role/OrganizationAccountAccessRole'
                  - !Sub 'arn:aws:iam::${WorkloadAccount}:role/OrganizationAccountAccessRole'

  # CloudTrail for organization-wide logging (Optional)
  OrganizationCloudTrail:
    Type: AWS::CloudTrail::Trail
    Condition: EnableCloudTrailCondition
    Properties:
      TrailName: OrganizationCloudTrail
      S3BucketName: !Ref CloudTrailBucket
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      IsOrganizationTrail: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::S3::Object
              Values: 
                - "arn:aws:s3:::*/*"
    DependsOn: CloudTrailBucketPolicy

  # S3 Bucket for CloudTrail logs
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Condition: EnableCloudTrailCondition
    Properties:
      BucketName: !Sub 'organization-cloudtrail-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 2555  # 7 years retention
            NoncurrentVersionExpirationInDays: 30

  # S3 Bucket Policy for CloudTrail
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableCloudTrailCondition
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
          - Sid: AWSCloudTrailOrganizationWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
          - Sid: AWSCloudTrailOrganizationCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn

Outputs:
  OrganizationId:
    Description: AWS Organization ID
    Value: !Ref Organization
    Export:
      Name: !Sub '${AWS::StackName}-OrganizationId'
      
  OrganizationRootId:
    Description: AWS Organization Root ID
    Value: !GetAtt Organization.RootId
    Export:
      Name: !Sub '${AWS::StackName}-OrganizationRootId'
      
  SecurityOUId:
    Description: Security Organizational Unit ID
    Value: !Ref SecurityOU
    Export:
      Name: !Sub '${AWS::StackName}-SecurityOUId'
      
  WorkloadsOUId:
    Description: Workloads Organizational Unit ID
    Value: !Ref WorkloadsOU
    Export:
      Name: !Sub '${AWS::StackName}-WorkloadsOUId'
      
  AuditAccountId:
    Description: Audit Account ID
    Value: !Ref AuditAccount
    Export:
      Name: !Sub '${AWS::StackName}-AuditAccountId'
      
  LoggingAccountId:
    Description: Logging Account ID
    Value: !Ref LoggingAccount
    Export:
      Name: !Sub '${AWS::StackName}-LoggingAccountId'
      
  WorkloadAccountId:
    Description: Workload Account ID
    Value: !Ref WorkloadAccount
    Export:
      Name: !Sub '${AWS::StackName}-WorkloadAccountId'
      
  ManagementAccountId:
    Description: Management Account ID (current account)
    Value: !Ref AWS::AccountId
    Export:
      Name: !Sub '${AWS::StackName}-ManagementAccountId'
      
  CloudTrailArn:
    Condition: EnableCloudTrailCondition
    Description: Organization CloudTrail ARN
    Value: !GetAtt OrganizationCloudTrail.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CloudTrailArn'
      
  CloudTrailBucketName:
    Condition: EnableCloudTrailCondition
    Description: CloudTrail S3 Bucket Name
    Value: !Ref CloudTrailBucket
    Export:
      Name: !Sub '${AWS::StackName}-CloudTrailBucketName'

# Metadata for AWS Security Specialty Exam preparation
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Account Configuration"
        Parameters:
          - AuditAccountEmail
          - LoggingAccountEmail
          - WorkloadAccountEmail
      - Label:
          default: "Organization Configuration"
        Parameters:
          - OrganizationFeatureSet
          - EnableCloudTrail
    ParameterLabels:
      AuditAccountEmail:
        default: "Audit Account Email"
      LoggingAccountEmail:
        default: "Logging Account Email"
      WorkloadAccountEmail:
        default: "Workload Account Email"
      OrganizationFeatureSet:
        default: "Organization Feature Set"
      EnableCloudTrail:
        default: "Enable Organization CloudTrail"
        
  # AWS Security Specialty Exam Domain Mapping
  ExamDomainMapping:
    Domain6_Governance:
      - "AWS Organizations setup and multi-account management"
      - "Organizational Unit structure and hierarchy"
      - "Consolidated billing configuration"
      - "Account lifecycle management"
    Domain4_IAM:
      - "Cross-account access roles and trust policies"
      - "OrganizationAccountAccessRole usage patterns"
      - "Multi-factor authentication requirements"
    Domain2_Logging:
      - "Organization-wide CloudTrail configuration"
      - "Centralized audit logging setup"
      - "Log file validation and integrity"